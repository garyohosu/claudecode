<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Othello - Three.js</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        #turn {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        #score {
            margin-bottom: 10px;
        }

        .score-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }

        .color-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid white;
        }

        .black {
            background: #2c3e50;
        }

        .white {
            background: #ecf0f1;
        }

        #reset-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #3498db;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #reset-btn:hover {
            background: #2980b9;
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            display: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 30px 60px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui">
        <div id="turn">黒のターン</div>
        <div id="score">
            <div class="score-item">
                <div class="color-indicator black"></div>
                <span id="black-score">2</span>
            </div>
            <div class="score-item">
                <div class="color-indicator white"></div>
                <span id="white-score">2</span>
            </div>
        </div>
        <button id="reset-btn">リセット</button>
    </div>

    <div id="message"></div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
